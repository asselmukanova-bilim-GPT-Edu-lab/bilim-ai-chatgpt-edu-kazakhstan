<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Методическая поддержка — Bilim AI</title>
  <meta name="description" content="Презентации семинаров Bilim AI для педагогов. Листайте слайды и открывайте презентации для демонстрации.">
  <link rel="icon" type="image/png" href="assets/bilim-ai-logo-symbol.png">
  <link rel="stylesheet" href="styles.css?v=20261119-10">
  <link rel="stylesheet" href="responsive.css?v=20261126">
  <style>
    html[lang="ru"] .admin-support-page [lang="kk"],
    html[lang="kk"] .admin-support-page [lang="ru"] { display: none; }
    .admin-support-page {
      min-height: 100svh;
      background: radial-gradient(ellipse at 88% 0, #eee9ff, transparent 49%), #f8f7fc;
    }
    .admin-support-main { padding-block: clamp(2.5rem, 7vw, 6rem); }
    .admin-support-main h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -.035em;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }
    .presentation-directory { margin-block-start: clamp(1.6rem, 4vw, 3rem); }
    .presentation-directory h2 { margin: 0 0 1rem; font-size: clamp(1.35rem, 3vw, 1.8rem); }
    .presentation-empty {
      max-width: 52rem;
      margin: 0;
      padding: 1.35rem 1.5rem;
      color: var(--muted);
      border: 1px dashed #d9d2ee;
      border-radius: 1rem;
      background: #fff;
    }
    .presentation-shelf {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1rem, 2.6vw, 2rem);
    }
    .presentation-card.video-card { min-width: 0; }
    .presentation-card.video-card:hover { transform: none; }
    .presentation-card .presentation-stage {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #f3f0fb;
      overflow: hidden;
      touch-action: pan-y;
    }
    .presentation-stage > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .presentation-stage .presentation-image-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      text-align: center;
      color: var(--muted);
    }
    .presentation-controls {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      gap: .5rem;
      align-items: center;
      justify-items: center;
      padding: .55rem .8rem;
      border-bottom: 1px solid var(--line);
    }
    .presentation-controls button {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f5f2ff;
      color: #4d27cc;
      font-size: 1.25rem;
      cursor: pointer;
    }
    .presentation-controls button[aria-disabled="true"] {
      color: #645d7a;
      background: #f6f5fa;
      opacity: .68;
      cursor: default;
    }
    .presentation-controls output { font-size: .875rem; color: var(--muted); text-align: center; }
    .presentation-card .video-card-copy { padding: clamp(.9rem, 2vw, 1.4rem); }
    .presentation-card h3 { margin: 0; font-size: clamp(1rem, 2vw, 1.25rem); overflow-wrap: anywhere; }
    .presentation-open {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-block-start: .8rem;
      padding: .55rem .9rem;
      border: 1px solid var(--line);
      border-radius: .7rem;
      color: #4d27cc;
      background: #f5f2ff;
      font-size: .875rem;
      font-weight: 750;
    }
    .presentation-open:hover { background: #eee7ff; }
    .presentation-card :focus-visible { outline: 3px solid #6f45ff; outline-offset: 2px; }
    .presentation-stage:focus-visible { outline-offset: -4px; }
    .admin-support-page [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .presentation-shelf { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body class="admin-support-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Bilim AI — главная">
        <img class="brand-logo brand-logo-dark" src="assets/bilim-ai-logo-dark.png" alt="Bilim AI">
        <span class="brand-context"><span>ChatGPT EDU — МЕКТЕП</span><span>Kazakhstan</span></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Меню</button>
      <nav id="main-nav" class="main-nav" aria-label="Основная навигация">
        <a href="index.html#resources"><span lang="ru">На главную</span><span lang="kk">Басты бетке</span></a>
        <button class="nav-action lang-toggle" type="button" aria-label="Переключить сайт на казахский язык">Қаз</button>
      </nav>
    </div>
  </header>
  <main class="container admin-support-main">
    <h1><span lang="ru">Методическая поддержка</span><span lang="kk">Әдістемелік қолдау</span></h1>
    <section class="presentation-directory" aria-labelledby="presentations-title">
      <h2 id="presentations-title"><span lang="ru">Презентации</span><span lang="kk">Презентациялар</span></h2>
      <p class="presentation-empty" id="presentation-empty"><span lang="ru">Презентации скоро появятся в этом разделе.</span><span lang="kk">Бұл бөлімде жақында презентациялар жарияланады.</span></p>
      <div class="presentation-shelf" id="presentation-shelf" hidden></div>
    </section>
  </main>
  <script src="script.js?v=20261119-3"></script>
  <script type="module" src="presentation-gallery.js?v=20261127-2"></script>
</body>
</html>
