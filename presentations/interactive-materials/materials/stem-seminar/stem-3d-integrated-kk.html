const ADVANCED_COPY = {"title":"Аркалы фермалары бар қағаз көпір","explanation":"Жоғары сыныптарға арналған үлгі. Иілген екі қағаз ферма, қырлы төсем және көлденең байланыстар біртұтас қаңқа құрайды. Түрлі түсті қондырмалар қайталанатын үшбұрыштардың ырғағын айқындайды.","status":"Оқу 3D-нобайы · өлшемдері шартты","footnote":"Модель құрылымның пішіні мен құрастырылуын көрсетеді. Жүк көтергіштігі нақты үлгіні сынау арқылы анықталады. Интерактивті модельді жүктеу үшін интернет қажет.","parts":[["Тіректер мен аралық","Екі тірек көпірдің аралығын белгілейді. Үлгілерді салыстырғанда тіректер арасы мен жүктің орны бірдей сақталады."],["Төсем парағы","Жазық қағаз парағы төсемді құрайды. Түрлі түсті жолақтар оның бойлық жиектерін көрсетеді."],["Жұп аркалы ферма","Үстіңгі иілген белдеу мен қиғаш бөлшектер екі қапталда қайталанатын үшбұрыштарды құрайды."],["Көлденең байланыстар","Көлденең бөлшектер екі ферманың үстіңгі жағын біріктіреді. Қиғаш бөлшектер төсем үстінде айқасады."],["Сәндік қондырмалар","Көгілдір және алтын түсті бөлшектер құрылымның өрнегін айқындайды. Қаңқаның пішінін сақтай отырып, оларды өзгертуге болады."],["Төсем астындағы көлденең қырлар","Төсем астында V пішінінде бүктелген жеке қағаз жолақтары орналасқан. Бөлшектелген көріністе әр бүктемені көруге болады."]],"stages":["Салыстырылатын үлгілердің тірек аралығын бірдей етіңіз.","Жазық төсем мен оның бойлық жиектерін қарастырыңыз.","Үшбұрыштар үстіңгі және астыңғы белдеулерді қалай байланыстыратынын бақылаңыз.","Екі бүйірлік ферманы біріктіретін байланыстарды табыңыз.","Өз түс үйлесіміңізді ұсынып, ерекшеленетін бөліктерді таңдауыңызды негіздеңіз.","V пішінді бүктемені және әр қырдың төсем астындағы орнын қарастырыңыз."],"button":"Аркалы көпірді 3D форматта ашу ↗"};
function buildAdvanced({ THREE, addPart }) {
  const paper = (color) => new THREE.MeshStandardMaterial({ color, roughness: .83, side: THREE.DoubleSide });
  const ivory = paper(0xece1c9);
  const edge = paper(0xbeb096);
  const purple = paper(0x5e3996);
  const midPurple = paper(0x9165c2);
  const teal = paper(0x219eab);
  const gold = paper(0xd79b32);
  const stone = paper(0x9a89a9);
  const sand = paper(0xe0d2ba);
  const slab = (group, size, point, material) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
    mesh.position.set(...point);
    group.add(mesh);
    return mesh;
  };
  const beam = (group, start, end, thickness, depth, material) => {
    const a = new THREE.Vector3(...start);
    const b = new THREE.Vector3(...end);
    const direction = b.clone().sub(a);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(direction.length() + thickness * .16, thickness, depth), material);
    mesh.position.copy(a.addScaledVector(direction, .5));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), direction.normalize());
    group.add(mesh);
  };
  const register = (index, explode, anchor) => {
    const group = new THREE.Group();
    const [name, info] = ADVANCED_COPY.parts[index];
    return { name, info, group, explode, anchor };
  };

  const supports = register(0, [0, -.85, 0], [3.05, .68, 1.13]);
  slab(supports.group, [8.6, .09, 4.0], [0, -.12, 0], sand);
  for (const x of [-3.12, 3.12]) {
    slab(supports.group, [.82, .67, 2.88], [x, .28, 0], stone);
    slab(supports.group, [.94, .13, 3.06], [x, .69, 0], sand);
    slab(supports.group, [.95, .11, 3.15], [x, -.02, 0], sand);
  }
  addPart(supports);

  const deck = register(1, [0, .32, 0], [0, .98, 1.36]);
  slab(deck.group, [7.0, .095, 2.46], [0, .94, 0], ivory);
  const underdeck = register(5, [0, -.23, 0], [.35, .88, 1.19]);
  const fold = new THREE.Shape();
  [[-.13,.018],[0,-.105],[.13,.018],[.112,.031],[0,-.075],[-.112,.031]].forEach(([x,y],i)=>i?fold.lineTo(x,y):fold.moveTo(x,y));
  fold.closePath();
  const ribGeometry = new THREE.ExtrudeGeometry(fold, {depth:2.38, bevelEnabled:false});
  ribGeometry.translate(0, 0, -1.19);
  for (let i = 0; i < 13; i++) {
    const rib = new THREE.Mesh(ribGeometry, i % 2 ? ivory : edge);
    rib.position.set(-3.22 + i * .535, .887, 0);
    underdeck.group.add(rib);
  }
  addPart(underdeck);
  for (const z of [-1.24, 1.24]) {
    slab(deck.group, [7.05, .12, .12], [0, .937, z], purple);
    slab(deck.group, [6.96, .022, .023], [0, .99, z * .91], gold);
  }
  addPart(deck);

  const trusses = register(2, [0, .81, 0], [-1.05, 2.81, 1.16]);
  const xs = [-3.42, -2.30, -1.15, 0, 1.15, 2.30, 3.42];
  const heights = [1.17, 2.16, 2.71, 2.89, 2.71, 2.16, 1.17];
  const topAt = (i, z) => [xs[i], heights[i], z];
  const bottomAt = (i, z) => [xs[i], 1.02, z];
  for (const z of [-1.19, 1.19]) {
    beam(trusses.group, bottomAt(0, z), bottomAt(xs.length - 1, z), .14, .18, purple);
    xs.slice(1).forEach((_, index) => {
      const i = index + 1;
      beam(trusses.group, topAt(i - 1, z), topAt(i, z), .165, .20, purple);
      beam(trusses.group, topAt(i - 1, z), topAt(i, z), .041, .04, ivory);
      const rising = index % 2 === 0;
      beam(trusses.group, rising ? bottomAt(i - 1, z) : topAt(i - 1, z), rising ? topAt(i, z) : bottomAt(i, z), .113, .128, midPurple);
    });
    for (let i = 1; i < xs.length - 1; i++) {
      beam(trusses.group, bottomAt(i, z), topAt(i, z), .082, .095, ivory);
      slab(trusses.group, [.112, .12, .23], topAt(i, z), gold);
    }
  }
  addPart(trusses);

  const braces = register(3, [0, 2.0, 0], [0, 2.94, 0]);
  for (let i = 1; i < xs.length - 1; i++) {
    beam(braces.group, topAt(i, -1.15), topAt(i, 1.15), .098, .114, teal);
    if (i < xs.length - 2) {
      beam(braces.group, topAt(i, -1.15), topAt(i + 1, 1.15), .067, .078, ivory);
      beam(braces.group, topAt(i, 1.15), topAt(i + 1, -1.15), .067, .078, ivory);
    }
  }
  addPart(braces);

  const ornaments = register(4, [0, .28, 1.25], [.62, 1.48, 1.31]);
  for (const z of [-1.31, 1.31]) {
    slab(ornaments.group, [6.78, .34, .06], [0, 1.12, z], ivory);
    for (let i = 0; i < 6; i++) {

      const face = z + Math.sign(z) * .043;
      const marker = slab(ornaments.group, [.20, .20, .041], [x, y, face], i % 2 === 0 ? teal : gold);

      if (i > 0 && i < 5) {
        beam(ornaments.group, [x - .26, y - .12, face], [x, y + .15, face], .042, .041, teal);
        beam(ornaments.group, [x, y + .15, face], [x + .26, y - .12, face], .042, .041, teal);
      }
    }
  }
  addPart(ornaments);

build({THREE,addPart}) {

 function woodTexture(){const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#b68b5c';ctx.fillRect(0,0,256,256);for(let i=0;i<85;i++){ctx.strokeStyle=i%3?'#987348':'#cba678';ctx.lineWidth=i%4?.7:1.5;ctx.beginPath();for(let x=0;x<=256;x+=8){const y=i*3+Math.sin(x*.025+i)*2.4; x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

 function line(points,color=0x8d9bad){return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p))),new THREE.LineBasicMaterial({color}))}
 function labelPlane(lines,w,h){const c=document.createElement('canvas');c.width=1024;c.height=640;const ctx=c.getContext('2d');ctx.fillStyle='#f2f0e7';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#153546';ctx.textBaseline='middle';ctx.font='bold 38px Arial';lines.forEach((s,i)=>{ctx.font=i===0?'bold 42px Arial':'32px Arial';ctx.fillStyle=i===0?'#117b70':'#153546';ctx.fillText(s,35,65+i*75)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,roughness:1,side:THREE.DoubleSide}))}
 const builtParts=[];function assembly(name,info,group,explode,anchor){addPart({name,info,group,explode,anchor});builtParts.push(group);return group}
 const base=new THREE.Group();const tabletop=block(7.9,.16,4.7,wood);tabletop.position.y=-.13;base.add(tabletop);assembly("Жұмыс үстелі","Модельдер тегіс бетте салыстырылады. Сынақ шарттары бірдей болуы керек.",base,[0,-.5,0],[0,0,2.2]);
 [-1,1].forEach((sign,i)=>{const group=new THREE.Group();group.position.set(sign*2.25,.5,0);group.add(block(.65,1,2.8,wood));const pad=block(.7,.04,2.9,dark);pad.position.y=.52;group.add(pad);for(let k=0;k<4;k++){const grain=line([[-.33,-.35+k*.22,1.411],[.33,-.31+k*.22,1.411]],0x8c633b);group.add(grain)}assembly(i?"Оң жақ тірек":"Сол жақ тірек","Екі бірдей тірек көпірдің аралығын белгілейді. Оқу тапсырмасында олардың ішкі жиектерінің арасы сызғышпен 15 см етіп қойылады.",group,[sign*.65,0,0],[0,.6,0])});

const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;
scene.add(new THREE.HemisphereLight(0xe1edf5,0x4c5c68,2.2));
const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(6,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x91bcd1,1.4);fill.position.set(-7,3,-5);scene.add(fill);

const parts=[],meshToPart=new WeakMap(),tags=[];
function addPart({name,info,group,explode=[0,0,0],anchor=null}){
 if(!name||!group?.isGroup)throw new Error('Every named part needs a THREE.Group');
 objectRoot.add(group);
 const meshes=[];
 group.traverse(node=>{if(node.isMesh){meshToPart.set(node,group);meshes.push(node)}});
 if(!meshes.length)throw new Error('A selectable part needs visible geometry: '+name);
 group.userData.model={name,info:info||'',base:group.position.clone(),explode:new THREE.Vector3(...explode),anchor:anchor?new THREE.Vector3(...anchor):null};
 parts.push(group);
 const tag=document.createElement('span');tag.className='tag';tag.textContent=name;$('labels').append(tag);
 const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('stroke','#afcad7');line.setAttribute('stroke-width','1');$('lines').append(line);
 tags.push({group,tag,line});return group;
}
// MODEL.build creates object-specific geometry and calls addPart for meaningful assemblies.
MODEL.build({THREE,scene,objectRoot,addPart});
if(!parts.length)throw new Error('The model has no selectable parts');
if(!Array.isArray(MODEL.stages)||!MODEL.stages.length)throw new Error('How it works needs object-specific stages');
for(const s of MODEL.stages)if(!parts.some(p=>p.userData.model.name===s.part)||!s.text)throw new Error('Invalid explanation stage: '+s.part);
scene.updateMatrixWorld(true);
for(const group of parts){
 const d=group.userData.model;if(d.anchor)continue;
 const b=new THREE.Box3().setFromObject(group),world=b.getCenter(new THREE.Vector3());world.y=b.max.y;
 d.anchor=group.worldToLocal(world);
}

const bounds=new THREE.Box3().setFromObject(objectRoot);
const center=bounds.getCenter(new THREE.Vector3());objectRoot.position.sub(center);
const sphere=bounds.getBoundingSphere(new THREE.Sphere());const radius=Math.max(.55,sphere.radius);
const flowMarkers=MODEL.stages.map(s=>{
 if(!s.path)return null;
 if(!Array.isArray(s.path)||s.path.length<2||s.path.some(p=>!Array.isArray(p)||p.length!==3))throw new Error('Invalid demonstration path: '+s.part);
 const curve=new THREE.CatmullRomCurve3(s.path.map(p=>new THREE.Vector3(...p)));
 const color=s.pathColor||0xffc86c;
 const route=new THREE.Mesh(new THREE.TubeGeometry(curve,48,radius*.008,8,false),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7}));
 const marker=new THREE.Mesh(new THREE.SphereGeometry(radius*.05,16,10),new THREE.MeshBasicMaterial({color}));
 route.visible=false;marker.visible=false;objectRoot.add(route,marker);
 return {curve,route,marker};
});
const initialDirection=new THREE.Vector3(1.25,.85,1.65).normalize();
function fit(){
 const narrow=Math.min(1,camera.aspect),half=Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*narrow);
 const framing=advancedView?(camera.aspect>1.35?.79:1.02):1.16;
 const distance=radius/Math.max(.12,Math.sin(half))*framing;
 camera.position.copy(initialDirection).multiplyScalar(distance);orbit.target.set(0,0,0);
 orbit.minDistance=radius*.3;orbit.maxDistance=radius*10;orbit.update();
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
new ResizeObserver(resize).observe(stage);resize();fit();

let selected=null,disassembled=false,labelsOn=false,step=-1,down=null;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',event=>{down={x:event.clientX,y:event.clientY}});
renderer.domElement.addEventListener('pointerup',event=>{
 if(!down)return;
 const moved=Math.hypot(event.clientX-down.x,event.clientY-down.y);down=null;
 if(moved>7)return;
 const r=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);
 raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(parts,true).find(h=>meshToPart.has(h.object));
 if(hit)select(meshToPart.get(hit.object));
});
function select(group){
 if(selected)selected.traverse(n=>{if(n.isMesh&&n.userData.originalMaterial){n.material.dispose();n.material=n.userData.originalMaterial;delete n.userData.originalMaterial}});
 selected=group;if(!group)return;
 group.traverse(n=>{if(n.isMesh&&n.material.emissive){n.userData.originalMaterial=n.material;n.material=n.material.clone();n.material.emissive.add(new THREE.Color(0x233b4c))}});
 $('partName').textContent=group.userData.model.name;$('partInfo').textContent=group.userData.model.info;
}
function press(id,on){$(id).setAttribute('aria-pressed',String(on))}
$('explode').onclick=()=>{disassembled=!disassembled;press('explode',disassembled);$('explode').textContent=disassembled?"Құрастыру":"Бөлшектеу"};
$('toggleLabels').onclick=()=>{labelsOn=!labelsOn;press('toggleLabels',labelsOn);$('toggleLabels').textContent=labelsOn?"Атауларды жасыру":"Атауларды көрсету"};
$('works').onclick=()=>{
 const stages=MODEL.stages;
 step=(step+1)%stages.length;const s=stages[step],group=parts.find(p=>p.userData.model.name===s.part);
 flowMarkers.forEach((f,i)=>{if(f)f.route.visible=f.marker.visible=i===step});
 if(group)select(group);$('partName').textContent=`Қалай жұмыс істейді? · ${step+1}/${stages.length}`;$('partInfo').textContent=s.text;
};
$('reset').onclick=()=>{step=-1;flowMarkers.forEach(f=>{if(f)f.route.visible=f.marker.visible=false});if(typeof MODEL.animateStage==='function')MODEL.animateStage({time:0,step:-1,parts,THREE});disassembled=false;labelsOn=false;press('explode',false);press('toggleLabels',false);$('explode').textContent="Бөлшектеу";$('toggleLabels').textContent="Атауларды көрсету";select(null);$('partName').textContent="Бөлікті таңдаңыз";$('partInfo').textContent="Модельдің бір бөлігін басыңыз. Тінтуірмен сүйреп айналдырыңыз, дөңгелегімен жақындатыңыз.";fit()};

const used=[],clip=new THREE.Vector3();
function updateLabels(){
 const width=stage.clientWidth,height=stage.clientHeight;used.length=0;
 scene.updateMatrixWorld(true);
 for(const {group,tag,line} of tags){
  tag.style.display='none';line.style.display='none';if(!labelsOn)continue;
  const p=group.localToWorld(group.userData.model.anchor.clone());clip.copy(p).project(camera);
  if(clip.z<0||clip.z>1||Math.abs(clip.x)>1||Math.abs(clip.y)>1)continue;
  const toward=p.clone().sub(camera.position),distance=toward.length();
  raycaster.set(camera.position,toward.normalize());
  const blocker=raycaster.intersectObjects(parts,true).find(h=>meshToPart.has(h.object)&&meshToPart.get(h.object)!==group);
  if(blocker&&blocker.distance<distance-.08)continue;
  const x=(clip.x+1)*width/2,y=(1-clip.y)*height/2;
  tag.style.display='block';tag.style.visibility='hidden';const tw=tag.offsetWidth,th=tag.offsetHeight;
  const positions=[[x-tw/2,y-th-13],[x+12,y-th/2],[x-tw-12,y-th/2],[x-tw/2,y+12]];
  const ok=positions.find(([px,py])=>px>4&&py>4&&px+tw<width-4&&py+th<height-4&&used.every(([ax,ay,aw,ah])=>px+tw+5<ax||ax+aw+5<px||py+th+5<ay||ay+ah+5<py));
  if(!ok){tag.style.display='none';continue}
  tag.style.left=ok[0]+'px';tag.style.top=ok[1]+'px';tag.style.visibility='visible';
  used.push([ok[0],ok[1],tw,th]);line.style.display='block';
  line.setAttribute('x1',x);line.setAttribute('y1',y);line.setAttribute('x2',ok[0]+tw/2);line.setAttribute('y2',ok[1]+th/2);
 }
}
let clock=0;
function frame(t){
 requestAnimationFrame(frame);const dt=Math.min(.05,(t-clock)/1000||0);clock=t;
 for(const group of parts){const d=group.userData.model,target=d.base.clone().addScaledVector(d.explode,disassembled?1:0);group.position.lerp(target,Math.min(1,dt*9))}
 if(step>=0&&typeof MODEL.animateStage==='function')MODEL.animateStage({time:t/1000,step,parts,THREE});
 if(step>=0&&flowMarkers[step])flowMarkers[step].marker.position.copy(flowMarkers[step].curve.getPointAt((t*.00035)%1));
 orbit.update();updateLabels();renderer.render(scene,camera);
}
requestAnimationFrame(frame);

if(advancedView){
 const switcher=document.createElement('div');switcher.className='advanced-view-switch';switcher.innerHTML="<button type=\"button\" id=\"advanced-3d-button\" aria-pressed=\"true\">Интерактивті 3D модель</button><button type=\"button\" id=\"advanced-paper-button\" aria-pressed=\"false\">Шынайы көрініс</button>";
 $('status').after(switcher);
 const paper=document.createElement('figure');paper.className='advanced-paper-view';paper.innerHTML="<img src=\"paper-arch-realistic.png\" width=\"1448\" height=\"1086\" alt=\"Қағаз көпірдің шынайы көрінісі. Үстіңгі көлденең және қиғаш байланыстар. Екі бүйірлік аркалы ферма. Бойлық жиектері бар төсем. Төсем астындағы жеке V пішінді қырлар. Бүйірдегі сәндік жолақтар. Үстіңгі тақтайшалары бар екі тірек және тұғыр.\"><figcaption>Бөлшектер жоғарыдан төмен қарай ретімен берілген.<ul class=\"advanced-parts-key\"><li>Үстіңгі көлденең және қиғаш байланыстар</li><li>Екі бүйірлік аркалы ферма</li><li>Бойлық жиектері бар төсем</li><li>Төсем астындағы жеке V пішінді қырлар</li><li>Бүйірдегі сәндік жолақтар</li><li>Үстіңгі тақтайшалары бар екі тірек және тұғыр</li></ul></figcaption>";stage.before(paper);
 const mode3d=$('advanced-3d-button'),modePaper=$('advanced-paper-button'),main=stage.closest('main');
 function selectView(showPaper){
  main.classList.toggle('advanced-paper-mode',showPaper);paper.hidden=!showPaper;
  mode3d.setAttribute('aria-pressed',String(!showPaper));modePaper.setAttribute('aria-pressed',String(showPaper));
  if(!showPaper)resize();
 }
 mode3d.addEventListener('click',()=>selectView(false));modePaper.addEventListener('click',()=>selectView(true));
 selectView(new URLSearchParams(location.search).get('view')==='paper');
}
</script>
</body>
