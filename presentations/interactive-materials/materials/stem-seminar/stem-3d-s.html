<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const MODEL = {
title:"Физика · деформация бумажного моста",
explanation:"Цель 7.2.2.3: различать упругую и пластическую деформации. Откройте «Как это работает», чтобы увидеть условный прогиб и восстановление.",
status:"Реалистичная учебная реконструкция · не точная CAD-модель",
footnote:"Учебный макет: форма, толщина и размеры приблизительны. Любые числа отмечены как условные. Для просмотра нужен интернет: Three.js загружается с CDN. Вращение — перетаскивание, масштаб — колесо мыши.",

build({THREE,addPart}) {
 const focus="s";
 const ivory=new THREE.MeshStandardMaterial({color:0xeee8d9,roughness:.94,side:THREE.DoubleSide});
 const metal=new THREE.MeshStandardMaterial({color:0x929ca4,metalness:.8,roughness:.32});
 const dark=new THREE.MeshStandardMaterial({color:0x22384a,roughness:.7});
 const teal=new THREE.MeshStandardMaterial({color:0x48bea9,roughness:.5});
 const amber=new THREE.MeshStandardMaterial({color:0xf0b960,roughness:.55});
 function woodTexture(){const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#b68b5c';ctx.fillRect(0,0,256,256);for(let i=0;i<85;i++){ctx.strokeStyle=i%3?'#987348':'#cba678';ctx.lineWidth=i%4?.7:1.5;ctx.beginPath();for(let x=0;x<=256;x+=8){const y=i*3+Math.sin(x*.025+i)*2.4; x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
 const wood=new THREE.MeshStandardMaterial({map:woodTexture(),roughness:.76});
 function block(w,h,d,mat){const x=-w/2,y=-h/2,r=Math.min(.06,w/8,h/8);const s=new THREE.Shape();s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.015,bevelThickness:.015});g.translate(0,0,-d/2);return new THREE.Mesh(g,mat)}
 function line(points,color=0x8d9bad){return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p))),new THREE.LineBasicMaterial({color}))}
 function labelPlane(lines,w,h){const c=document.createElement('canvas');c.width=1024;c.height=640;const ctx=c.getContext('2d');ctx.fillStyle='#f2f0e7';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#153546';ctx.textBaseline='middle';ctx.font='bold 38px Arial';lines.forEach((s,i)=>{ctx.font=i===0?'bold 42px Arial':'32px Arial';ctx.fillStyle=i===0?'#117b70':'#153546';ctx.fillText(s,35,65+i*75)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,roughness:1,side:THREE.DoubleSide}))}
 const builtParts=[];function assembly(name,info,group,explode,anchor){addPart({name,info,group,explode,anchor});builtParts.push(group);return group}
 const base=new THREE.Group();const tabletop=block(7.9,.16,4.7,wood);tabletop.position.y=-.13;base.add(tabletop);assembly('Рабочий стол','Ровная поверхность для сравнения моделей; условия испытаний должны быть одинаковыми.',base,[0,-.5,0],[0,0,2.2]);
 [-1,1].forEach((sign,i)=>{const group=new THREE.Group();group.position.set(sign*2.25,.5,0);group.add(block(.65,1,2.8,wood));const pad=block(.7,.04,2.9,dark);pad.position.y=.52;group.add(pad);for(let k=0;k<4;k++){const grain=line([[-.33,-.35+k*.22,1.411],[.33,-.31+k*.22,1.411]],0x8c633b);group.add(grain)}assembly(i?'Правая опора':'Левая опора','Две одинаковые опоры задают пролёт. В учебном задании расстояние между внутренними краями устанавливают линейкой на 15 см.',group,[sign*.65,0,0],[0,.6,0])});
 function paperMesh(corrugated,sag=0,folds=8){const vertices=[],indices=[],nx=72,nz=32;for(let ix=0;ix<=nx;ix++){const x=-2.7+5.4*ix/nx;for(let iz=0;iz<=nz;iz++){const z=-1.25+2.5*iz/nz;const fold=corrugated?(Math.abs(((iz/nz*folds)%1)-.5)*2-.5)*.28:0;const bend=Math.max(0,1-(x/2.35)**2);vertices.push(x,1.115+fold-sag*bend,z)}}for(let ix=0;ix<nx;ix++)for(let iz=0;iz<nz;iz++){let a=ix*(nz+1)+iz,b=a+nz+1;indices.push(a,b,a+1,a+1,b,b+1)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(indices);g.computeVertexNormals();const mesh=new THREE.Mesh(g,ivory.clone());mesh.userData.original=Float32Array.from(vertices);return mesh}
 const paper=new THREE.Group();const sheet=paperMesh(focus!=='s');paper.add(sheet);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(sheet.geometry,28),new THREE.LineBasicMaterial({color:0xb8b0a0,transparent:true,opacity:.7}));paper.add(edge);paper.userData.sheet=sheet;paper.userData.edge=edge;assembly('Бумажный пролёт','Тонкий лист и продольные сгибы образуют несущую часть. Геометрия и толщина показаны приблизительно; это не расчёт прочности.',paper,[0,1.1,0],[0,1.35,-.5]);
 const load=new THREE.Group();load.position.set(0,1.21,0);const tray=block(.85,.065,.85,dark);load.add(tray);for(let i=0;i<3;i++){const cylinder=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.12,48),metal);cylinder.position.y=.10+i*.13;load.add(cylinder);const ring=new THREE.Mesh(new THREE.TorusGeometry(.21,.008,8,48),dark);ring.rotation.x=Math.PI/2;ring.position.y=.162+i*.13;load.add(ring)}load.children.forEach(child=>child.userData.restY=child.position.y);load.userData.startY=load.position.y;assembly('Набор одинаковых грузов','Грузы добавляются постепенно. Их вид иллюстративный, массу по изображению определить нельзя. Испытания проводят на столе и прекращают при заметной деформации.',load,[0,1.8,0],[0,.55,0]);
 const ruler=new THREE.Group();ruler.position.set(0,.15,1.82);ruler.add(block(5.2,.055,.33,new THREE.MeshStandardMaterial({color:0xc8b486,roughness:.7})));for(let i=0;i<=30;i++){let x=-2.25+i*.15;ruler.add(line([[x,.038,-.14],[x,.038,i%2===0?.09:-.01]],0x332b23))}const rulerText=labelPlane(['Пролёт в задании — 15 см','Сравнивайте одинаковые условия'],3.9,.52);rulerText.rotation.x=-Math.PI/2;rulerText.position.set(0,.045,.5);ruler.add(rulerText);assembly('Измерительная линейка','Проверка одинакового пролёта и положения нагрузки. Размеры 3D-реконструкции условны; линейка на столе нужна в реальном опыте.',ruler,[0,0,1],[0,.06,0]);
 if(focus==='e'){
   const sketches=new THREE.Group();sketches.position.set(0,2.4,-1.75);const plate=labelPlane(['Два эскиза — одно ограничение','А: плоский лист','Б: продольные сгибы','Выбор → испытание → улучшение'],4.5,2.4);sketches.add(plate);assembly('Эскизы конструкции','Сначала сравните варианты по задаче, а не по внешнему виду. После испытания измените один параметр и повторите измерение.',sketches,[0,.6,-.8],[0,1.3,0]);
 }
 if(focus==='m'){
   const chart=new THREE.Group();chart.position.set(0,0,-1.55);
   const board=labelPlane(['УСЛОВНЫЕ ДАННЫЕ','Плоский: 2, 3, 2 груза','Со сгибами: 5, 6, 5 грузов','Средние: 2,33 и 5,33','В опыте получите свои данные'],5.2,2.9);board.position.set(0,2.4,-.6);chart.add(board);
   [2.33,5.33].forEach((v,i)=>{const h=v*.20;const bar=block(.55,h,.55,i?teal:amber);bar.position.set(i?.6:-.6,h/2,.12);chart.add(bar)});
   assembly('Диаграмма результатов','Это учебный набор, не результат реальных испытаний. Сначала собирают данные, затем считают среднее и объясняют различия. Высота столбцов пропорциональна средним 2,33 и 5,33.',chart,[0,0,-1],[0,3.95,-.6]);
 }
 if(focus==='t'){
   const data=new THREE.Group();data.position.set(0,2.3,-1.8);const before=2,after=5,delta=after-before;
   const screen=labelPlane(['УЧЕБНАЯ ТАБЛИЦА','B2: до = '+before+'   C2: после = '+after,'D2: =C2-B2 → '+delta,'Проверьте: 5 − 2 = 3','Замените числа данными опыта'],5.4,2.9);data.add(screen);
   const frame=block(5.65,3.12,.10,dark);frame.position.z=-.09;data.add(frame);
   for(let x=-2.45;x<2.5;x+=.6){data.add(line([[x,-1.43,.02],[x,1.43,.02]],0xc5d0ca))}
   assembly('Таблица и формула','Пример формулы электронной таблицы: D2=C2−B2. Числа 2 и 5 условны; результат 3 вычислен. Изменение числа грузов не равно автоматически изменению силы без знания их массы.',data,[0,.6,-1],[0,1.7,0]);
 }
 // Object-specific learner workspace; the viewer keeps its existing controls.
 const stageNode=document.getElementById('stage');
 const workspace=document.createElement('div');workspace.className='learner-workspace';
 stageNode.parentNode.insertBefore(workspace,stageNode);
 const ui=document.createElement('section');ui.className='learner-controls';ui.setAttribute('aria-label','Действия ученика');
 workspace.append(stageNode,ui);
 const style=document.createElement('style');style.textContent=`
 .learner-workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;margin-top:14px}.learner-workspace #stage{margin:0;height:650px;min-height:400px}.learner-controls{max-height:650px;overflow:auto;padding:18px;border:1px solid #476578;border-radius:14px;background:#182a38}.learner-controls h2{font-size:22px;margin:0 0 12px;color:#65dfc5}.learner-controls h3{font-size:18px;margin:17px 0 9px}.learner-controls p{font-size:15px;margin:10px 0}.learner-controls label{display:block;margin:12px 0;font-size:15px}.learner-controls input,.learner-controls select,.learner-controls textarea{width:100%;box-sizing:border-box;color:#f3f6fa;background:#101c26;border:1px solid #7b96a5;border-radius:7px;padding:9px;font:inherit;margin-top:5px}.learner-controls textarea{min-height:70px;resize:vertical}.learner-controls button{font-size:14px;margin:4px 4px 4px 0}.learner-controls button:disabled{opacity:.4;cursor:default}.learner-controls table{width:100%;border-collapse:collapse;font-size:13px}.learner-controls td,.learner-controls th{text-align:left;border-bottom:1px solid #456071;padding:7px 4px}.lab-status{padding:10px;border-left:3px solid #65dfc5;background:#203a49;min-height:40px;white-space:pre-wrap}.lab-note{font-size:13px!important;color:#eac78a!important}.lab-sketch{display:block;width:100%;height:100px;background:#faf7eb;border-radius:7px;touch-action:none;cursor:crosshair}.learner-controls .paired{display:grid;grid-template-columns:1fr 1fr;gap:10px}.learner-controls .mono{font-family:monospace}@media(max-width:850px){.learner-workspace{grid-template-columns:1fr}.learner-workspace #stage{height:450px;min-height:330px}.learner-controls{max-height:none}}`;
 document.head.append(style);
 const $lab=id=>ui.querySelector('#'+id);
 const safe=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const findPart=name=>builtParts.find(p=>p.userData.model.name===name);
 load.children.forEach(child=>child.userData.restY=child.position.y);
 const originalTray=load.children[0];
 // Six identical visual weights, each with its own rim. Count is a teaching unit, not grams.
 while(load.children.length<13){const i=(load.children.length-1)/2;const w=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.12,48),metal);w.position.y=.10+i*.13;w.userData.restY=w.position.y;load.add(w);const ring=new THREE.Mesh(new THREE.TorusGeometry(.21,.008,8,48),dark);ring.rotation.x=Math.PI/2;ring.position.y=.162+i*.13;ring.userData.restY=ring.position.y;load.add(ring)}
 let currentSag=0,animation=0;
 function deform(sag){const mesh=paper.userData.sheet,original=mesh.userData.original,positions=mesh.geometry.attributes.position;for(let i=0;i<positions.count;i++){const x=original[i*3];positions.setY(i,original[i*3+1]-sag*Math.max(0,1-(x/2.35)**2))}positions.needsUpdate=true;mesh.geometry.computeVertexNormals();paper.userData.edge.geometry.dispose();paper.userData.edge.geometry=new THREE.EdgesGeometry(mesh.geometry,28);paper.userData.edge.visible=true;load.children.forEach(child=>child.position.y=child.userData.restY-sag);currentSag=sag;}
 function setSag(target){cancelAnimationFrame(animation);const from=currentSag,start=performance.now();function tick(now){const t=Math.min(1,(now-start)/650);deform(from+(target-from)*(t*t*(3-2*t)));if(t<1)animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)}
 function setLoad(count){load.children.forEach((child,i)=>child.visible=i===0?count>0:Math.floor((i-1)/2)<count)}
 function setShape(shape){const fresh=paperMesh(shape!=='flat',0,shape==='fold4'?4:8);paper.userData.sheet.geometry.dispose();paper.userData.sheet.geometry=fresh.geometry;paper.userData.sheet.userData.original=fresh.userData.original;deform(currentSag)}
 function updateBoard(name,lines){const part=findPart(name);if(!part)return;const display=part.children.find(m=>m.isMesh&&m.geometry.type==='PlaneGeometry');if(!display)return;const next=labelPlane(lines,1,1);display.material.map?.dispose();display.material.dispose();display.material=next.material;next.geometry.dispose()}
 function exportResult(data){const blob=new Blob([JSON.stringify({subject:focus,title:MODEL.title,notice:'Результат учебной работы. Виртуальные данные не являются измерениями реальной бумаги.',...data},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='STEM-'+focus+'-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 const intro='<h2>Выполните действия ученика</h2><p class="lab-note">Виртуальная учебная установка. Она не рассчитывает реальную прочность бумаги. Записи сохраняйте кнопкой «Скачать результат» до закрытия окна.</p>';
 if(focus==='s'){
  ui.innerHTML=intro+`<h3>1. Выберите учебный сценарий</h3><label>Поведение после снятия нагрузки<select id="s-mode"><option value="elastic">Упругая деформация</option><option value="residual">С остаточной деформацией</option></select></label><p>Сценарий задан заранее для сравнения признаков; он не определяет предел упругости бумаги.</p><h3>2. Приложите и снимите нагрузку</h3><label>Одинаковых грузов: <output id="s-count">0</output><input id="s-load" type="range" min="0" max="3" step="1" value="0"></label><button id="s-small" type="button">Приложить 1 груз</button><button id="s-remove" type="button" disabled>Снять нагрузку</button><p id="s-status" class="lab-status" aria-live="polite">Начальная форма. Приложите нагрузку.</p><h3>3. Запишите наблюдение</h3><label>Что стало с формой после снятия нагрузки?<textarea id="s-observation" placeholder="Форма восстановилась / остался прогиб. Как это видно?"></textarea></label><button id="s-record" type="button" disabled>Записать наблюдение</button><table><thead><tr><th>Сценарий</th><th>Наблюдение</th></tr></thead><tbody id="s-rows"></tbody></table><button id="s-reset" type="button">Новый опыт</button><button id="s-export" type="button">Скачать результат</button>`;
  let applied=false,removed=false,hadResidual=false,rows=[];
  function change(count){$lab('s-count').textContent=count;setLoad(count);const mode=$lab('s-mode').value;if(count>0){applied=true;removed=false;hadResidual=mode==='residual';setSag(.07*count);$lab('s-status').textContent='Нагрузка приложена: виден прогиб. Теперь снимите грузы.'}else if(applied){removed=true;setSag(hadResidual?.10:0);$lab('s-status').textContent=hadResidual?'После снятия груза остаётся условный прогиб. Запишите признак необратимого изменения.':'После снятия груза форма восстанавливается. Запишите признак упругой деформации.'}else setSag(0);$lab('s-remove').disabled=count===0;$lab('s-record').disabled=!removed;}
  function reset(){applied=false;removed=false;hadResidual=false;$lab('s-load').value=0;$lab('s-count').textContent=0;setLoad(0);setSag(0);$lab('s-status').textContent='Начальная форма. Приложите нагрузку.';$lab('s-record').disabled=true;$lab('s-remove').disabled=true;$lab('s-observation').value='';}
  $lab('s-load').addEventListener('input',()=>change(Number($lab('s-load').value)));

$('reset').onclick=()=>{step=-1;flowMarkers.forEach(f=>{if(f)f.route.visible=f.marker.visible=false});if(typeof MODEL.animateStage==='function')MODEL.animateStage({time:0,step:-1,parts,THREE});disassembled=false;labelsOn=false;press('explode',false);press('toggleLabels',false);$('explode').textContent='Разобрать';$('toggleLabels').textContent='Показать подписи';select(null);$('partName').textContent='Выберите деталь';$('partInfo').textContent='Нажмите на часть модели. Мышью вращайте, колесом приближайте.';fit()};

const used=[],clip=new THREE.Vector3();
function updateLabels(){
 const width=stage.clientWidth,height=stage.clientHeight;used.length=0;
 scene.updateMatrixWorld(true);
 for(const {group,tag,line} of tags){
  tag.style.display='none';line.style.display='none';if(!labelsOn)continue;
  const p=group.localToWorld(group.userData.model.anchor.clone());clip.copy(p).project(camera);
  if(clip.z<0||clip.z>1||Math.abs(clip.x)>1||Math.abs(clip.y)>1)continue;
  const toward=p.clone().sub(camera.position),distance=toward.length();
  raycaster.set(camera.position,toward.normalize());
  const blocker=raycaster.intersectObjects(parts,true).find(h=>meshToPart.has(h.object)&&meshToPart.get(h.object)!==group);
  if(blocker&&blocker.distance<distance-.08)continue;
  const x=(clip.x+1)*width/2,y=(1-clip.y)*height/2;
  tag.style.display='block';tag.style.visibility='hidden';const tw=tag.offsetWidth,th=tag.offsetHeight;
  const positions=[[x-tw/2,y-th-13],[x+12,y-th/2],[x-tw-12,y-th/2],[x-tw/2,y+12]];
  const ok=positions.find(([px,py])=>px>4&&py>4&&px+tw<width-4&&py+th<height-4&&used.every(([ax,ay,aw,ah])=>px+tw+5<ax||ax+aw+5<px||py+th+5<ay||ay+ah+5<py));
  if(!ok){tag.style.display='none';continue}
  tag.style.left=ok[0]+'px';tag.style.top=ok[1]+'px';tag.style.visibility='visible';
  used.push([ok[0],ok[1],tw,th]);line.style.display='block';
  line.setAttribute('x1',x);line.setAttribute('y1',y);line.setAttribute('x2',ok[0]+tw/2);line.setAttribute('y2',ok[1]+th/2);
 }
}
let clock=0;
function frame(t){
 requestAnimationFrame(frame);const dt=Math.min(.05,(t-clock)/1000||0);clock=t;
 for(const group of parts){const d=group.userData.model,target=d.base.clone().addScaledVector(d.explode,disassembled?1:0);group.position.lerp(target,Math.min(1,dt*9))}
 if(step>=0&&typeof MODEL.animateStage==='function')MODEL.animateStage({time:t/1000,step,parts,THREE});
 if(step>=0&&flowMarkers[step])flowMarkers[step].marker.position.copy(flowMarkers[step].curve.getPointAt((t*.00035)%1));
 orbit.update();updateLabels();renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
